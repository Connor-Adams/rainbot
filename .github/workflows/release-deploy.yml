name: Release Deploy (Dokploy)

# Deploys are pushed from here rather than pulled by Dokploy: Dokploy's registry
# auto-deploy webhook understands DockerHub payloads only, and GHCR emits no
# equivalent, so its documented path for other registries is an API call from CI
# (https://docs.dokploy.com/docs/core/auto-deploy). Pushing also lets us order
# the deploys, which a registry watcher could not: the workers give up
# permanently after four failed registrations, so starting them against a
# raincloud that is still booting leaves them stuck at registered=0.
#
# This runs alongside release-promote.yml on the same `release: published` event.
# Promotion is a registry-side re-tag of :prod and Dokploy pulls :prod when it
# deploys, so the ordering between the two matters: see the wait-for-promotion
# step below.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy (bypass CI + diff gating)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: read
  # await-promotion lists workflow runs to confirm :prod actually moved.
  actions: read

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Dokploy Deploys
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}
      services: ${{ steps.detect.outputs.services }}
      tag_sha: ${{ steps.tag.outputs.sha }}
      default_branch: ${{ steps.repo.outputs.default_branch }}

    steps:
      - name: Repo info
        id: repo
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.setOutput('default_branch', data.default_branch);

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag SHA
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.payload.release?.tag_name;
            if (!tagName) {
              core.setFailed('Release tag not found in payload.');
              return;
            }
            const ref = `tags/${tagName}`;
            const { data: tagRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
            });
            core.setOutput('sha', tagRef.object.sha);

      - name: Verify release tag (branch + CI)
        uses: ./.github/actions/verify-release-tag
        with:
          sha: ${{ steps.tag.outputs.sha }}
          default_branch: ${{ steps.repo.outputs.default_branch }}
          force: ${{ inputs.force }}

      - name: Detect service changes
        id: detect
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI not found; falling back to git describe for previous tag."
          fi

          if git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            CURRENT_TAG="${RELEASE_TAG}"
          else
            CURRENT_TAG="refs/tags/${RELEASE_TAG}"
          fi

          PREV_TAG=""
          if command -v gh >/dev/null 2>&1; then
            if PREV_TAG_API=$(gh api repos/${GITHUB_REPOSITORY}/releases \
              --jq '.[] | select(.tag_name != env.RELEASE_TAG) | .tag_name' | head -n 1); then
              PREV_TAG="${PREV_TAG_API}"
            fi
          fi
          if [[ -z "${PREV_TAG}" ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          fi

          # No previous tag => deploy everything (first release)
          if [[ -z "${PREV_TAG}" ]]; then
            echo "services=raincloud,rainbot,pranjeet,hungerbot,ui" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RANGE="${PREV_TAG}..${CURRENT_TAG}"
          changed() { git diff --name-only "${RANGE}" -- "$1" | grep -q .; }

          # packages/ and the root manifests feed every image, the dashboard
          # included. ui/ is NOT shared: no bot serves the dashboard, so a
          # ui-only change must not restart the bots.
          SHARED=false
          if changed "packages/" || changed "package.json" || changed "yarn.lock" || changed "turbo.json"; then
            SHARED=true
          fi

          SERVICES=""
          add() {
            if [[ -n "${SERVICES}" ]]; then SERVICES="${SERVICES},"; fi
            SERVICES="${SERVICES}$1"
          }

          if [[ "${SHARED}" == "true" ]] || changed "apps/raincloud/"; then add "raincloud"; fi
          if [[ "${SHARED}" == "true" ]] || changed "apps/rainbot/"; then add "rainbot"; fi
          if [[ "${SHARED}" == "true" ]] || changed "apps/pranjeet/"; then add "pranjeet"; fi
          if [[ "${SHARED}" == "true" ]] || changed "apps/hungerbot/"; then add "hungerbot"; fi
          if [[ "${SHARED}" == "true" ]] || changed "ui/"; then add "ui"; fi

          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          if [[ -z "${SERVICES}" ]]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  # Dokploy pulls :prod, so deploying before release-promote.yml has moved that
  # tag would redeploy the PREVIOUS release's image and report success.
  await-promotion:
    name: Wait for :prod promotion
    needs: [plan]
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Release Promote to finish
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ needs.plan.outputs.tag_sha }}';
            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });
              const runs = data.workflow_runs.filter((r) => r.name === 'Release Promote (GHCR :prod)');
              if (!runs.length) {
                core.setFailed(`No Release Promote run found for ${sha}. Refusing to deploy a stale :prod.`);
                return;
              }
              const run = runs[0];
              if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info(`Promotion succeeded: ${run.html_url}`);
                  return;
                }
                core.setFailed(`Promotion concluded ${run.conclusion}: ${run.html_url}`);
                return;
              }
              core.info(`Promotion still ${run.status}; waiting.`);
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setFailed('Timed out waiting for the :prod promotion to complete.');

  # Raincloud first, on its own, and only then the workers.
  deploy-raincloud:
    name: Deploy raincloud
    needs: [plan, await-promotion]
    if: ${{ contains(needs.plan.outputs.services, 'raincloud') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Dokploy
        uses: ./.github/actions/dokploy-deploy
        with:
          base_url: ${{ secrets.DOKPLOY_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          application_id: ${{ secrets.DOKPLOY_APP_ID_RAINCLOUD }}
          service: raincloud

      # Dokploy reporting the deploy done is not the same as the orchestrator
      # being ready to register workers, so gate on its own readiness probe when
      # the URL is configured.
      - name: Wait for /health/ready
        env:
          HEALTH_URL: ${{ secrets.RAINCLOUD_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${HEALTH_URL}" ]]; then
            echo "::warning::RAINCLOUD_HEALTH_URL not set — deploying workers without confirming the orchestrator is ready."
            exit 0
          fi
          curl -fsSL --retry 30 --retry-all-errors --retry-delay 5 "${HEALTH_URL}"
          echo "raincloud is ready."

  deploy-workers:
    name: Deploy ${{ matrix.service }}
    needs: [plan, await-promotion, deploy-raincloud]
    # Workers still deploy when raincloud is unchanged (its job is skipped), but
    # never when its deploy actually failed.
    if: ${{ !cancelled() && needs.deploy-raincloud.result != 'failure' && contains(needs.plan.outputs.services, matrix.service) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: rainbot
            id_secret: DOKPLOY_APP_ID_RAINBOT
          - service: pranjeet
            id_secret: DOKPLOY_APP_ID_PRANJEET
          - service: hungerbot
            id_secret: DOKPLOY_APP_ID_HUNGERBOT
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Dokploy
        uses: ./.github/actions/dokploy-deploy
        with:
          base_url: ${{ secrets.DOKPLOY_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          application_id: ${{ secrets[matrix.id_secret] }}
          service: ${{ matrix.service }}

  # The dashboard is a standalone nginx image that no bot serves, so it has no
  # ordering relationship to the orchestrator.
  deploy-ui:
    name: Deploy ui
    needs: [plan, await-promotion]
    if: ${{ contains(needs.plan.outputs.services, 'ui') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Dokploy
        uses: ./.github/actions/dokploy-deploy
        with:
          base_url: ${{ secrets.DOKPLOY_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          application_id: ${{ secrets.DOKPLOY_APP_ID_UI }}
          service: ui

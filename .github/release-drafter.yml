name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

version-resolver:
  major:
    labels: ['major', 'breaking', 'breaking-change']
  minor:
    labels: ['feature', 'enhancement', 'feat']
  patch:
    labels: ['fix', 'bug']
  default: patch

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
no-changes-template: '- No changes'

categories:
  - title: 'Maintenance'
    labels: ['chore', 'deps', 'dependencies', 'maintenance']
  - title: 'Features & Fixes'
    labels: ['feature', 'enhancement', 'feat', 'fix', 'bug']
  - title: 'Other Changes'
    labels: ['*']

category-template: |
  $TITLE

  $CHANGES

template: |
  What's Changed

  $CHANGES

  Deployment Model (Important)

  - Prod runs on **Dokploy**, and every service tracks the `:prod` image tag
  - Publishing this release re-tags each service's already-built image as `v$RESOLVED_VERSION` and `:prod` (`release-promote.yml`); nothing is rebuilt
  - Services with no code changes are re-tagged to the same image digest they already run
  - `release-deploy.yml` then has Dokploy redeploy only the services that changed: raincloud first, then the workers (the dashboard deploys alongside)

  Docker Images (GHCR)

  Pull images manually (if needed):

  # Raincloud Orchestrator
  ghcr.io/connor-adams/rainbot-raincloud:prod

  # Worker Bots
  ghcr.io/connor-adams/rainbot-rainbot:prod
  ghcr.io/connor-adams/rainbot-pranjeet:prod
  ghcr.io/connor-adams/rainbot-hungerbot:prod

  # Dashboard
  ghcr.io/connor-adams/rainbot-ui:prod

  Dokploy

  No manual action required. The deploy runs from CI once this release is published; a draft deploys nothing.

  Full Changelog: $PREVIOUS_TAG...v$RESOLVED_VERSION

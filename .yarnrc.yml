enableScripts: true

nodeLinker: node-modules

# @connor-adams/* (designsystem, tokens) publish to GitHub Packages, not npm.
# NODE_AUTH_TOKEN is supplied by the environment: locally from the shell, in CI
# from secrets.GITHUB_TOKEN, and in image builds as a BuildKit secret mount so
# it never lands in a layer.
npmScopes:
  connor-adams:
    npmRegistryServer: 'https://npm.pkg.github.com'
    npmAuthToken: '${NODE_AUTH_TOKEN:-}'
